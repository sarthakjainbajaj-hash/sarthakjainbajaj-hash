<svg width="100%" height="100%" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="50%" stop-color="#141414" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#ef4444" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#ef4444" stroke-opacity="0.4" stroke-width="1.5" />
  <rect width="900" height="220" rx="16" fill="url(#grid)" />

  <!-- Glowing Accent Lines -->
  <path d="M 40 20 L 860 20" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  <circle cx="450" cy="20" r="4" fill="#ef4444" filter="url(#glow)" />

  <!-- Code Elements / Ambient Tech Details -->
  <text x="50" y="55" fill="#ef4444" font-family="'Fira Code', monospace" font-size="13" font-weight="600" opacity="0.85">&lt;portfolio /&gt;</text>
  <text x="850" y="55" text-anchor="end" fill="#64748b" font-family="'Fira Code', monospace" font-size="12">v2.0 • 2026</text>

  <!-- Main Name Title -->
  <text x="450" y="105" text-anchor="middle" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="34" font-weight="900" letter-spacing="3">
    SARTHAK JAIN BAJAJ
  </text>

  <!-- Subtitle -->
  <text x="450" y="138" text-anchor="middle" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" letter-spacing="2">
    AI &amp; DATA SCIENCE  •  FULL-STACK WEB  •  EMBEDDED IoT
  </text>

  <!-- Feature Pills -->
  <g transform="translate(180, 162)">
    <rect x="0" y="0" width="160" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#22c55e" />
    <text x="28" y="18" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">First-Year B.Tech</text>
  </g>

  <g transform="translate(360, 162)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#ef4444" />
    <text x="28" y="18" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Real-Time Solutions</text>
  </g>

  <g transform="translate(550, 162)">
    <rect x="0" y="0" width="170" height="28" rx="14" fill="#18181b" stroke="#27272a" stroke-width="1" />
    <circle cx="16" cy="14" r="4" fill="#3b82f6" />
    <text x="28" y="18" fill="#e4e4e7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">Open For Internships</text>
  </g>

  <!-- Bottom Accent Line -->
  <path d="M 80 205 L 820 205" stroke="url(#accentGrad)" stroke-width="1" opacity="0.3" stroke-dasharray="6,6" />
</svg>
