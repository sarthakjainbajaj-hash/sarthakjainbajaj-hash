<svg width="100%" height="100%" viewBox="0 0 720 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="quoteBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d0d" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="quoteBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="720" height="120" rx="14" fill="url(#quoteBg)" stroke="url(#quoteBorder)" stroke-width="1.2" stroke-opacity="0.6" />

  <!-- Quote Icon -->
  <text x="36" y="55" fill="#ef4444" font-family="'Georgia', serif" font-size="44" font-weight="bold" opacity="0.6">“</text>

  <!-- Quote Text -->
  <text x="70" y="48" fill="#f3f4f6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" font-style="italic">
    Driven by curiosity. Building for impact. Turning random ideas into scalable reality.
  </text>

  <text x="70" y="82" fill="#ef4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
    — SARTHAK JAIN BAJAJ
  </text>

  <text x="680" y="90" text-anchor="end" fill="#ef4444" font-family="'Georgia', serif" font-size="44" font-weight="bold" opacity="0.6">”</text>
</svg>
